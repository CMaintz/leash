# Publish to npm and cut the GitHub release when a version tag is pushed.
# Flow: bump package.json + CHANGELOG in a PR, merge, then `git tag vX.Y.Z && git push --tags`.
# Auth is npm trusted publishing (OIDC), so there is no NPM_TOKEN; provenance comes with it.
# Trusted publishing is configured on the package's npm page, which exists only after one
# manual publish. A version already on npm (that manual one) is skipped, not re-published.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance
jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.9.2" # pin mise itself, not just the action
      - name: Tag must match package.json
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - name: npm with trusted publishing support (11.5.1+)
        run: npm install -g npm@11.21.0
      - run: npm ci
      - name: Gate (same verbs as CI)
        run: mise run lint && mise run typecheck && mise run test
      - name: Publish
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          if npm view "@cmaintz/leash@$v" version > /dev/null 2>&1; then
            echo "@cmaintz/leash@$v is already on npm, nothing to publish"
          else
            npm publish --access public
          fi
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

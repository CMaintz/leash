# Dogfood: Leash judges its own turns against .leash/rubric.json, and this check makes
# any loosening of that rubric (a removed rule, a raised threshold, a newly deferred rule)
# a red, reviewable PR check. Deterministic - no Jev call, no key needed.
name: leash-guard
on: { pull_request: {} }
permissions: { contents: read }
jobs:
  guard:
    name: Rubric not loosened
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # guard reads the rubric as of the base branch
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.9.2" # pin mise itself, not just the action
      - run: npm ci
      - run: npm run build
      - name: leash guard
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node dist/cli.js guard "origin/$BASE_REF"
